name: Deploy to EC2 on prod push

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Package JAR for Docker
        run: cp build/libs/ticketing-*-SNAPSHOT.jar ticketing-app.jar

      # 앱 서버에는 JAR·Docker 정의만 전송 (소스·*.md·문서 디렉터리 없음)
      - name: Copy bundle to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem "ubuntu@$EC2_HOST" "mkdir -p ~/ticketing"
          scp -o StrictHostKeyChecking=no -i ec2_key.pem \
            ticketing-app.jar Dockerfile.runtime docker-compose.app.yml \
            "ubuntu@$EC2_HOST:~/ticketing/"

      - name: Rebuild image and run on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem "ubuntu@$EC2_HOST" \
            "cd ~/ticketing && sudo docker compose -f docker-compose.app.yml up -d --build"
