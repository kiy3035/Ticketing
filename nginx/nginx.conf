worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # SSE 경로의 JWT 쿼리 파라미터(accessToken, refreshToken)가 nginx 로그에 평문으로 기록되는 것을 방지.
    # 토큰이 로그 파일로 유출되면 만료 전까지 해당 토큰으로 요청을 위조할 수 있다.
    map $request_uri $loggable_uri {
        ~^/api/notifications/stream  "/api/notifications/stream?[TOKEN_MASKED]";
        default                       $request_uri;
    }

    log_format main '$remote_addr - [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    upstream ticketing_app {
        least_conn;
        server 172.31.46.152:8080 max_fails=2 fail_timeout=10s;
        server 172.31.37.7:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        # 클라이언트 실제 IP 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 일반 API
        location / {
            proxy_pass         http://ticketing_app;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # 서버 장애·재시작 시 자동으로 다른 서버에 재시도 → 사용자에게 에러 노출 안 됨
            # non_idempotent: POST/PUT/DELETE도 재시도 허용
            # (홀드는 분산 락, 결제는 멱등 키로 중복 방지되어 있어 안전)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # 두 서버 모두 다운됐을 때 사용자에게 보여줄 에러 페이지
        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }

        # SSE 전용 — 버퍼링 끄고 타임아웃을 SseEmitter(30분)에 맞춤
        # 버퍼링이 켜져 있으면 서버가 보낸 이벤트가 클라이언트에 즉시 전달되지 않음
        location /api/notifications/stream {
            proxy_pass         http://ticketing_app;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;

            # SSE는 chunked transfer 필수
            chunked_transfer_encoding on;
        }
    }
}
