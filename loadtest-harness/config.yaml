# 부하 테스트 자동화 하네스 설정
# 코드 규칙: 임계치·URL·반복횟수 등 모든 매직 값은 여기로 외부화 (하드코딩 금지)
# __APP__ 토큰은 런타임에 prometheus.app_label 값으로 치환됨

k6:
  binary: k6                       # k6 실행 파일 (PATH에 있으면 그대로)
  base_url: http://localhost:8080  # 부하 대상 (운영: nginx IP)
  concert_id: 1                    # 테스트 콘서트 ID
  repeat: 3                        # 회차 반복 — 기존 1회차/2회차/3회차 수동 작업을 자동화
  # 각 회차(run) 시작 전에 실행할 리셋 명령 — "Redis cold 매 회차" 방법론 자동화.
  # 비우면(기본) 리셋 없이 연속 실행 → run1 잔여 상태가 run2·3 오염 가능.
  # 예) 전용 부하서버 Redis 비우기:  reset_command: "redis-cli -h <redis_ip> -p 6379 flushdb"
  # 주의) JVM cold(run1만)는 하네스 밖 — 하네스 실행 '직전'에 앱서버를 재시작할 것.
  reset_command: ""
  # 시나리오 목록. script 경로는 이 config 파일 기준 상대경로
  scenarios:
    - name: knee-point
      script: ../load-tests/knee-point.js
      env:
        K6_QUEUE_POLL_SLEEP_SEC: "0.005"
        K6_QUEUE_MAX_POLL: "300"

prometheus:
  base_url: http://localhost:9090
  app_label: ticketing             # management.metrics.tags.application 값
  step: 15s                        # range query 해상도
  settle_seconds: 5                # 테스트 종료 후 마지막 스크랩 반영 대기
  # 수집 메트릭: 표시이름 → PromQL. docs/monitoring.md의 Golden Signals 기반
  queries:
    rps: 'sum(rate(http_server_requests_seconds_count{application="__APP__"}[30s]))'
    latency_p95: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="__APP__"}[1m])) by (le))'
    error_rate: 'sum(rate(http_server_requests_seconds_count{application="__APP__",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application="__APP__"}[1m])), 1)'
    hikari_active: 'sum(hikaricp_connections_active{application="__APP__"})'
    hikari_pending: 'sum(hikaricp_connections_pending{application="__APP__"})'
    hold_conflict: 'sum(rate(ticketing_hold_conflict_total{application="__APP__"}[1m]))'
    lock_acquire_failures: 'sum(rate(ticketing_lock_acquire_failures_total{application="__APP__"}[1m]))'
    queue_waiting: 'sum(ticketing_queue_waiting_count{application="__APP__"})'

analyzer:
  enabled: true
  model: gemini-2.5-flash          # 무료 티어. 품질 더 필요하면 GEMINI_MODEL로 override
  # gemini-2.5-flash는 thinking(사고) 토큰을 쓰므로 출력이 잘리지 않게 넉넉히.
  # (2000이면 thinking이 예산을 먹어 분석이 중간에 끊겼음)
  max_tokens: 8000
  # API 키는 환경변수 GEMINI_API_KEY 에서 읽음 (config에 절대 평문 저장 금지)
  # 없으면 분석만 건너뛰고 원본 메트릭 표/차트는 그대로 생성됨

report:
  output_dir: reports              # 이 config 파일 기준 상대경로
  charts: true                     # matplotlib PNG 생성 (Grafana 수동 스크린샷 대체)

# AI 튜닝 어드바이저 (advisor.py) — 부하 결과를 보고 '구조화된' 튜닝 제안을 낸다.
# 가드레일: AI는 제안만, 적용 가능한 파라미터는 아래 화이트리스트뿐. 범위 밖 값은 코드가 clamp.
# 의도적 제외: lock.ttl / hold.ttl 등 '정확성·UX'에 영향 주는 값은 자동 튜닝 대상이 아니다.
#            (성능 안전 노브 = 커넥션 풀만 둔다.)
tuning:
  enabled: true
  model: gemini-2.5-flash          # 분석기와 동일 무료 티어. GEMINI_MODEL로 override 가능
  max_tokens: 4000
  # 화이트리스트: env 이름(Spring relaxed binding) → 현재값/허용범위.
  # current는 application.properties 값을 미러링한다(앱 코드 수정 없이 env override로 적용).
  params:
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:
      current: 30
      min: 10
      max: 80
      desc: "HikariCP 최대 커넥션 풀 크기 (DB 커넥션 병목 노브)"
    SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:
      current: 20
      min: 8
      max: 64
      desc: "Lettuce(Redis) 최대 활성 커넥션 (락/홀드 경로 병목 노브)"
  # 전후(BEFORE→AFTER) 채택/롤백 판정 임계 — tuning_loop.decide()가 사용(하드코딩 금지)
  decide:
    improve_pct: 5.0     # rps↑ 또는 p95↓ 가 이 % 이상이면 '개선'으로 인정 → ADOPT 후보
    regress_pct: 5.0     # 어떤 지표든 이 % 이상 악화면 무조건 ROLLBACK
    error_abs: 0.01      # error_rate 절대 증가 허용폭(초과 시 ROLLBACK)
  # --apply(실험적 적용) 설정 — 소스가 아니라 env override로만 적용한다.
  apply:
    # 제안 적용 후 앱을 재기동하는 명령(환경마다 다름 → 외부화). {env}/{value} 치환 가능.
    # 비우면 --apply 불가(dry-run만). 예) "ssh app 'EXPORT {env}={value} && sudo systemctl restart app'"
    restart_command: ""
    warmup_seconds: 20   # 재기동 후 측정 전 워밍업(JVM/풀 안정화) 대기
  # ablation 스윕(ablation.py) — 한 파라미터의 여러 후보값을 훑어 '설정 축의 knee point'를 찾는다.
  sweep:
    param: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE  # 스윕 대상(반드시 위 params 화이트리스트에 있어야 함)
    values: [20, 30, 40, 50, 60, 70]    # 후보값들(단일 변수 격리 — 한 파라미터만)
    error_cap: 0.05                      # 이 error_rate 초과 후보는 기각(가드)
    knee_min_gain_pct: 2.0               # 직전 대비 rps 증가율이 이 % 미만이면 수확체감(sweet spot)
