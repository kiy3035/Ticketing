# 운영·수평 확장(ALB 다중 앱 인스턴스)용. 로컬은 기본 프로필만 사용.

# ALB/리버스 프록시의 X-Forwarded-* 반영 → OAuth redirect·{baseUrl}·요청 스킴이 공개 URL과 일치
server.forward-headers-strategy=framework

# 롤링 배포 시 진행 중 요청 마무리 후 종료
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Docker/JAR 배포: 로컬 개발용 file: 정적 경로 제거 (컨테이너에 src/ 없음)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.no-store=false
spring.web.resources.cache.cachecontrol.max-age=3600

logging.level.org.springframework.security=INFO

# Prometheus/Grafana에서 인스턴스 구분 (EC2마다 INSTANCE_ID 또는 HOSTNAME)
management.metrics.tags.instance=${INSTANCE_ID:${HOSTNAME:unknown}}
