spring.application.name=ticketing

# MySQL (환경변수 또는 .env에서 주입)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketing?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis (환경변수 또는 .env에서 주입)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 캐시 설정
spring.cache.type=redis

# 좌석 홀드 설정
ticketing.hold.ttl-seconds=300
ticketing.hold.cleanup-interval-ms=60000
