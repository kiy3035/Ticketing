spring.application.name=ticketing

# Virtual Thread (Java 21 Loom): Tomcat 요청 스레드를 가상 스레드로 전환
# Platform Thread 풀 200개 한계 제거 → I/O 대기(Redis/DB/Kafka) 중 OS 스레드를 점유하지 않음
spring.threads.virtual.enabled=true

# MySQL (.env에서 주입)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketing?useSSL=false&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
# DB·앱·화면 모두 한국 시간으로 맞춤. concert_at은 DATETIME(로컬) 사용
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
# JVM 기본 시간대는 TicketingApplication.main()에서 TimeZone.setDefault(Asia/Seoul)로 설정됨 → LocalDateTime.now() = 서울 시간

# Flyway DB 마이그레이션 (ddl-auto=validate와 함께 사용)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Redis (.env에서 주입)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis 연결 풀 설정 (부하 테스트용)
# 최대 활성 연결 수: 20
spring.data.redis.lettuce.pool.max-active=20
# 최대 유휴 연결 수: 10
spring.data.redis.lettuce.pool.max-idle=10
# 최소 유휴 연결 수: 5
spring.data.redis.lettuce.pool.min-idle=5
# 연결 대기 시간: 2000ms
spring.data.redis.lettuce.pool.max-wait=2000ms
# 명령어 타임아웃: 2000ms
spring.data.redis.timeout=2000ms

# 세션 (Redis)
spring.session.store-type=redis
spring.session.redis.namespace=ticketing:sessions
server.servlet.session.timeout=30m

# Kafka (.env에서 주입)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:ticketing-notification}
spring.kafka.consumer.auto-offset-reset=latest

# 캐시 설정
spring.cache.type=redis
logging.level.org.springframework.cache=DEBUG

# ========== 부하테스트용 TTL (실서비스 시 5→락, 300→600 홀드, 60→1800 대기열 토큰 등으로 복원 권장) ==========
# 좌석 동시 선점(락). 부하테스트: 짧게 유지해 락 경합 시 빠른 해제
ticketing.lock.ttl-seconds=3
# 좌석 홀드. 부하테스트: 5분으로 단축해 자원 빠른 회전 (실서비스 600=10분)
ticketing.hold.ttl-seconds=300
# 만료 홀드 정리 주기 (60초)
ticketing.hold.cleanup-interval-ms=60000
ticketing.hold.cleanup-batch-size=200
ticketing.kafka.hold-topic=ticketing.seat-hold-events

# 결제 진행 중 홀드 연장 (20분 제한)
# - 결제 요청 시 해당 홀드 TTL을 20분(1200초)으로 연장하여 결제 완료까지 유지.
ticketing.payment.hold-extension-ttl-seconds=1200

# 토스페이먼츠 PG (.env 또는 시스템 환경 변수. spring-dotenv 사용 시 env. 접두사로 읽음)
# 주문서형(위젯): 결제위젯 연동 키만 사용. 클라이언트 test_gck_... / 시크릿 test_gsk_... 세트 (개발자센터 > 결제위젯 연동 키)
# API 개별 연동 키(test_ck_/test_sk_)는 위젯 미지원.
ticketing.toss.client-key=${env.TOSS_CLIENT_KEY:${TOSS_CLIENT_KEY:}}
ticketing.toss.secret-key=${env.TOSS_SECRET_KEY:${TOSS_SECRET_KEY:}}
ticketing.toss.security-key=${env.TOSS_SECURITY_KEY:${TOSS_SECURITY_KEY:}}

# 취소된 공연 환불 배치 (주기: 5분. 급하지 않음, DB 부하 분산)
ticketing.refund.batch-size=50
ticketing.refund.interval-ms=300000

# 대기열 설정 (부하테스트: 토큰 60초로 단축해 대기열 빠른 정리) 임시로 10명 (원래50명)
ticketing.queue.batch-size=50
ticketing.queue.processing-interval-ms=2000
ticketing.queue.token-ttl-seconds=60
ticketing.queue.cleanup-interval-ms=60000
ticketing.queue.cleanup-batch-size=200
# 대기 인원이 이 값 이하이고 좌석 있으면 진입 시 즉시 입장 (0=비활성화)
ticketing.queue.immediate-allow-threshold=30
# 대기 인원이 이 값 초과일 때만 대기열 필요(패턴 B). 이하면 바로 좌석 페이지 (0=항상 대기열 없음)
ticketing.queue.activation-threshold=50

# 이메일 설정 (Google SMTP) (.env에서 주입)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 보안/에러 로그 파일 기록
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/ticketing.log

# 정적 리소스 캐시 비활성화(개발 편의)
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.chain.cache=false

# OAuth2 Google (.env: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)
# 값이 없으면 플레이스홀더로 기동만 되며, Google 로그인은 유효한 클라이언트 등록 후에만 동작함
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:oauth-not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:oauth-not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# 정적 리소스를 파일 시스템에서 직접 로드(재시작 없이 반영)
spring.web.resources.static-locations=classpath:/static/,file:${user.dir}/src/main/resources/static/

# Solapi SMS 설정 (.env에서 주입)
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.from-number=${SOLAPI_FROM_NUMBER}
solapi.api-url=https://api.solapi.com

# Actuator + Prometheus 메트릭 (Grafana 대시보드 연동)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
# HTTP 지연 p95 등: Prometheus에 *_bucket 시리즈를 보내야 histogram_quantile 사용 가능
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ========== Rate Limit (Sliding Window, Redis 기반) ==========
ticketing.rate-limit.enabled=true
ticketing.rate-limit.requests-per-second=10
ticketing.rate-limit.window-seconds=1

# ========== Resilience4j CircuitBreaker (Redis 장애 대응) ==========
resilience4j.circuitbreaker.instances.redisCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.redisCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
