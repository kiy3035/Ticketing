<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>예매내역 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
	<style>
		.reservations-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
		.reservations-tab {
			padding: 12px 20px; border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 500;
			border-bottom: 3px solid transparent; cursor: pointer;
		}
		.reservations-tab:hover { color: var(--text); }
		.reservations-tab.active { color: var(--primary-2); border-bottom-color: var(--primary-2); }
		.reservations-tabpanel { display: none; }
		.reservations-tabpanel.active { display: block; }
		.hold-card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
	</style>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="/app.html">
			<span class="logo">CT</span>
			<span>Concert Ticketing</span>
		</a>
		<nav class="nav">
			<a href="/app.html">콘서트</a>
			<a href="/reservations.html" class="active">예매내역</a>
			<span>고객센터</span>
		</nav>
		<div class="user">
			<div class="notifications">
				<button id="notificationBell" class="ghost bell" aria-label="알림 열기">
					<svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22Z"/>
						<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z"/>
					</svg>
					<span id="notificationCount" class="badge count hidden">0</span>
				</button>
				<div id="notificationPanel" class="notification-panel">
					<div class="notification-header">알림</div>
					<ul id="notificationList" class="notification-list"></ul>
				</div>
			</div>
			<a class="ghost topbar-link" href="/mypage.html">마이페이지</a>
			<span id="userName" class="badge">user</span>
			<button id="logoutBtn" class="ghost">로그아웃</button>
		</div>
	</header>

	<main class="container">
		<section class="hero">
			<div class="hero-card">
				<h1>예매내역</h1>
				<p>완료된 예매 내역과 좌석 정보를 확인할 수 있습니다.</p>
				<div class="hero-actions">
					<a class="primary" href="/app.html">새 공연 예매</a>
					<button class="outline" type="button">이용 안내</button>
				</div>
			</div>
			<div class="balance-card">
				<div class="label">최근 예매 요약</div>
				<div id="reservationSummary" class="balance-amount">-</div>
				<div class="helper">최근 30일 기준으로 집계됩니다.</div>
			</div>
		</section>

		<section class="panel">
			<div class="reservations-tabs">
				<button type="button" class="reservations-tab active" data-tab="holds">예약 중</button>
				<button type="button" class="reservations-tab" data-tab="reservations">예매 내역</button>
			</div>
			<div id="holdsPanel" class="reservations-tabpanel active">
				<div class="panel-header">
					<h2>예약 중인 좌석</h2>
					<span class="helper">결제 전 좌석을 잡아둔 상태입니다. 만료 전에 결제를 진행하세요.</span>
				</div>
				<div id="holdList" class="reservation-list"></div>
			</div>
			<div id="reservationsPanel" class="reservations-tabpanel">
				<div class="panel-header">
					<h2>예매 리스트</h2>
					<span class="helper">결제 완료 후 확정된 예약만 표시됩니다.</span>
				</div>
				<div id="reservationList" class="reservation-list"></div>
			</div>
			<div id="reservationStatus" class="status info"></div>
		</section>
	</main>

	<script src="/js/api.js"></script>
	<script src="/js/notifications.js"></script>
	<script src="/js/topbar.js"></script>
	<script src="/js/init.js"></script>
	<script src="/js/reservations.js"></script>
</body>
</html>
