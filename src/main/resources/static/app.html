<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>콘서트 목록 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<header class="topbar">
		<div class="brand">
			<span class="logo">CT</span>
			<span>Concert Ticketing</span>
		</div>
		<nav class="nav">
			<span>콘서트</span>
			<span>예매내역</span>
			<span>고객센터</span>
		</nav>
		<div class="user">
			<div class="notifications">
				<button id="notificationBell" class="ghost bell" aria-label="알림 열기">
					<svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22Z"/>
						<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z"/>
					</svg>
					<span id="notificationCount" class="badge count hidden">0</span>
				</button>
				<div id="notificationPanel" class="notification-panel">
					<div class="notification-header">알림</div>
					<ul id="notificationList" class="notification-list"></ul>
				</div>
			</div>
			<span id="userName" class="badge">user</span>
			<button id="logoutBtn" class="ghost">로그아웃</button>
		</div>
	</header>

	<main class="container">
		<section class="hero">
			<div class="hero-card">
				<h1>지금 예매 가능한 콘서트</h1>
				<p>실시간 좌석 현황과 안전한 예약 프로세스를 제공합니다.</p>
				<div class="hero-actions">
					<button class="primary">인기 공연 보기</button>
					<button class="outline">예매 가이드</button>
				</div>
			</div>
			<div class="stats">
				<div class="stat">
					<div class="label">실시간 접속자</div>
					<div id="statActiveUsers" class="value">-</div>
				</div>
				<div class="stat">
					<div class="label">오늘 오픈</div>
					<div id="statTodayOpen" class="value">-</div>
				</div>
				<div class="stat">
					<div class="label">예약 성공률</div>
					<div id="statSuccessRate" class="value">-</div>
				</div>
			</div>
		</section>

		<section class="chip-group">
			<span class="chip">전체</span>
			<span class="chip">아이돌</span>
			<span class="chip">밴드</span>
			<span class="chip">힙합</span>
			<span class="chip">클래식</span>
		</section>

		<section>
			<div id="concertList" class="card-grid"></div>
		</section>
	</main>

	<script src="/js/notifications.js"></script>
	<script src="/js/app.js"></script>
</body>
</html>
