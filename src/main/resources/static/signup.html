<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
	<div class="auth-card">
		<!-- 회원가입 제목 -->
		<h1>회원가입</h1>
		<p class="helper">간단한 정보로 빠르게 계정을 만들 수 있어요.</p>

		<!-- 상태 메시지 -->
		<p id="statusError" class="status error" hidden></p>
		<p id="statusInfo" class="status info">아이디 4~20자, 비밀번호 6~50자</p>

		<!-- 회원가입 폼 -->
		<form id="signupForm">
			<label>
				<span>아이디</span>
				<input id="username" type="text" placeholder="4~20자" minlength="4" maxlength="20" required>
			</label>
			<label>
				<span>비밀번호</span>
				<input id="password" type="password" placeholder="6~50자" minlength="6" maxlength="50" required>
			</label>
			<label>
				<span>이메일</span>
				<input id="email" type="email" placeholder="example@email.com" required>
			</label>
			<label>
				<span>휴대폰번호</span>
				<input id="phone" type="tel" placeholder="010-0000-0000" required>
			</label>
			
			<div class="notification-preference">
				<label class="preference-label">
					<span>결제 알림 방식</span>
				</label>
				<div class="toggle-group">
					<button type="button" class="toggle-btn active" data-method="sms">
						<svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
						<span>문자</span>
					</button>
					<button type="button" class="toggle-btn" data-method="email">
						<svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
							<rect x="2" y="4" width="20" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
							<path d="m22 6-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
						<span>이메일</span>
					</button>
				</div>
				<input id="notificationMethod" type="hidden" value="sms">
			</div>

			<button type="submit" class="primary">회원가입</button>
		</form>

		<!-- 로그인 이동 -->
		<p class="helper">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
	</div>

	<script src="/js/api.js"></script>
	<script src="/js/signup.js"></script>
</body>
</html>
