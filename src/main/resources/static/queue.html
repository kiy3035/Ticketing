<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>대기열 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="/app.html">
			<span class="logo">CT</span>
			<span>Concert Ticketing</span>
		</a>
		<nav class="nav">
			<a href="/app.html">콘서트</a>
			<a href="/reservations.html">예매내역</a>
			<span>대기열</span>
		</nav>
		<div class="user">
			<div class="notifications">
				<button id="notificationBell" class="ghost bell" aria-label="알림 열기">
					<svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22Z"/>
						<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z"/>
					</svg>
					<span id="notificationCount" class="badge count hidden">0</span>
				</button>
				<div id="notificationPanel" class="notification-panel">
					<div class="notification-header">알림</div>
					<ul id="notificationList" class="notification-list"></ul>
				</div>
			</div>
			<a class="ghost topbar-link" href="/mypage.html">마이페이지</a>
			<span id="userName" class="badge">user</span>
			<button id="logoutBtn" class="ghost">로그아웃</button>
		</div>
	</header>

	<main class="container queue-page">
		<section class="hero">
			<div class="hero-card">
				<h1 id="concertTitle">대기열</h1>
				<p id="concertMeta">예매를 위해 대기 중입니다.</p>
			</div>
		</section>

		<section class="queue-modal">
			<div id="queueCard" class="queue-card">
				<div class="queue-card-header">
					<span class="badge light">대기열 안내</span>
					<h2>예매 입장 순서를 확인 중입니다</h2>
					<p>실시간으로 순번을 업데이트하며, 입장 허용 시 자동으로 이동합니다.</p>
				</div>
				<div class="queue-stats">
					<div class="queue-stat-card">
						<div class="label">현재 순번</div>
						<div id="currentRank" class="value large">-</div>
					</div>
					<div class="queue-stat-card">
						<div class="label">전체 대기인원</div>
						<div id="totalWaiting" class="value large">-</div>
					</div>
				</div>
				<div class="queue-message">
					<p id="queueMessage">대기열에 진입 중...</p>
				</div>
				<div class="queue-progress">
					<div class="queue-progress-track">
						<div class="queue-progress-bar"></div>
					</div>
					<p class="queue-progress-hint">입장 순서에 따라 자동으로 이동합니다.</p>
				</div>
				<div class="queue-actions">
					<button type="button" id="queueExitBtn" class="btn ghost">대기열 나가기</button>
				</div>
			</div>
		</section>
	</main>

	<script src="/js/api.js"></script>
	<script src="/js/notifications.js"></script>
	<script src="/js/topbar.js"></script>
	<script src="/js/init.js"></script>
	<script src="/js/queue.js"></script>
</body>
</html>
