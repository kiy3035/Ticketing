<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>마이페이지 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="/app.html">
			<span class="logo">CT</span>
			<span>Concert Ticketing</span>
		</a>
		<nav class="nav">
			<a href="/app.html">콘서트</a>
			<a href="/reservations.html">예매내역</a>
			<span>고객센터</span>
		</nav>
		<div class="user">
			<div class="notifications">
				<button id="notificationBell" class="ghost bell" aria-label="알림 열기">
					<svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22Z"/>
						<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z"/>
					</svg>
					<span id="notificationCount" class="badge count hidden">0</span>
				</button>
				<div id="notificationPanel" class="notification-panel">
					<div class="notification-header">알림</div>
					<ul id="notificationList" class="notification-list"></ul>
				</div>
			</div>
			<a class="ghost topbar-link" href="/mypage.html">마이페이지</a>
			<span id="userName" class="badge">user</span>
			<button id="logoutBtn" class="ghost">로그아웃</button>
		</div>
	</header>

	<main class="container">
		<section class="hero">
			<div class="hero-card">
				<h1>마이페이지</h1>
				<p>가입 축하 100만원 지급! 실제 결제는 발생하지 않습니다.</p>
				<div class="hero-actions">
					<a class="primary" href="/app.html">콘서트 둘러보기</a>
					<button class="outline" type="button">이벤트 확인</button>
				</div>
			</div>
			<div class="balance-card">
				<div class="label">현재 보유 포인트</div>
				<div id="profileBalance" class="balance-amount">-</div>
				<div class="helper">회원가입 시 지급된 1,000,000 포인트</div>
			</div>
		</section>

		<section class="panel">
			<h2>내 계정 정보</h2>
			<div class="profile-list">
				<div class="profile-item">
					<span class="label">사용자 아이디</span>
					<span id="profileName" class="value">-</span>
				</div>
				<div class="profile-item">
					<span class="label">가입 일시</span>
					<span id="profileCreatedAt" class="value">-</span>
				</div>
			</div>
			<div id="profileStatus" class="status info"></div>
		</section>
	</main>

	<script src="/js/api.js"></script>
	<script src="/js/notifications.js"></script>
	<script src="/js/topbar.js"></script>
	<script src="/js/init.js"></script>
	<script src="/js/mypage.js"></script>
</body>
</html>
