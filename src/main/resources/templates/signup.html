<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
	<div class="auth-card">
		<!-- 회원가입 제목 -->
		<h1>회원가입</h1>

		<!-- 검증 오류 메시지 -->
		<p class="status error" th:if="${#fields.hasErrors('*')}">입력값을 확인해주세요.</p>

		<!-- 회원가입 폼 -->
		<form method="post" action="/signup" th:object="${signupRequest}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				<span>아이디</span>
				<input type="text" th:field="*{username}" placeholder="4~20자" required>
			</label>
			<label>
				<span>비밀번호</span>
				<input type="password" th:field="*{password}" placeholder="6~50자" required>
			</label>
			<button type="submit" class="primary">회원가입</button>
		</form>

		<!-- 로그인 이동 -->
		<p class="helper">이미 계정이 있나요? <a href="/login">로그인</a></p>
	</div>
</body>
</html>
