<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>로그인 | 콘서트 예매</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
	<div class="auth-card">
		<!-- 로그인 제목 -->
		<h1>콘서트 예매 로그인</h1>

		<!-- 상태 메시지 -->
		<p class="status ok" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인하세요.</p>
		<p class="status error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
		<p class="status info" th:if="${param.logout}">로그아웃되었습니다.</p>

		<!-- 로그인 폼 -->
		<form method="post" action="/login">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				<span>아이디</span>
				<input type="text" name="username" placeholder="아이디" required>
			</label>
			<label>
				<span>비밀번호</span>
				<input type="password" name="password" placeholder="비밀번호" required>
			</label>
			<button type="submit" class="primary">로그인</button>
		</form>

		<!-- 회원가입 이동 -->
		<p class="helper">계정이 없나요? <a href="/signup">회원가입</a></p>
	</div>
</body>
</html>
