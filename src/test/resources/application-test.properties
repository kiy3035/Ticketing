# 테스트 프로필: Testcontainers가 동적으로 주입하는 값 사용
ticketing.jwt.secret=test-jwt-secret-at-least-32-chars-long!!
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cache=WARN

# Flyway 비활성화 (Testcontainers는 create-drop 사용)
spring.flyway.enabled=false

# 테스트용 설정
ticketing.lock.ttl-seconds=2
ticketing.hold.ttl-seconds=10
ticketing.hold.cleanup-interval-ms=1000
ticketing.queue.token-ttl-seconds=30
ticketing.queue.batch-size=10
ticketing.queue.processing-interval-ms=500

# 메일/SMS 더미값
TOSS_CLIENT_KEY=test
TOSS_SECRET_KEY=test
TOSS_SECURITY_KEY=test
